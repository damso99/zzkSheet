<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost Ark Homework Party Builder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
        </div>
        <div>
          <p>Lost Ark</p>
          <h1>숙제 파티 빌더</h1>
        </div>
      </div>

      <form id="roster-form" class="lookup">
        <label for="character-name">대표 캐릭터</label>
        <div class="lookup-row">
          <input id="character-name" name="character-name" placeholder="캐릭터명" autocomplete="off" />
          <button type="submit" title="원정대 조회" aria-label="원정대 조회">
            <span class="icon search"></span>
          </button>
        </div>
      </form>

      <div class="actions">
        <button id="sample-button" type="button">샘플 불러오기</button>
        <button id="clear-button" type="button">초기화</button>
      </div>

      <nav class="view-tabs" aria-label="보기 전환">
        <button class="tab-button active" type="button" data-view="party">자동 파티</button>
        <button class="tab-button" type="button" data-view="character">캐릭터 정보</button>
        <button class="tab-button" type="button" data-view="roster">보유캐릭터</button>
      </nav>

      <section class="panel rules-panel">
        <div class="panel-title">
          <h2>숙제 규칙</h2>
          <button id="add-rule-button" type="button" title="규칙 추가" aria-label="규칙 추가">
            <span class="icon plus"></span>
          </button>
        </div>
        <div id="rules-list" class="rules-list"></div>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p id="status-text">대표 캐릭터를 입력하거나 샘플로 시작하세요.</p>
          <h2 id="view-title">레벨별 자동 파티</h2>
        </div>
        <div class="stats">
          <div>
            <span id="roster-count">0</span>
            <small>원정대</small>
          </div>
          <div>
            <span id="character-count">0</span>
            <small>캐릭터</small>
          </div>
        </div>
      </header>

      <section id="roster-strip" class="roster-strip"></section>
      <section id="character-view" class="detail-view" hidden></section>
      <section id="roster-view" class="detail-view" hidden></section>
      <section id="plan-view" class="plan-view"></section>
    </main>

    <template id="rule-template">
      <div class="rule-item">
        <input class="rule-name" aria-label="숙제 이름" />
        <input class="rule-level" aria-label="입장 레벨" type="number" min="0" step="10" />
        <select class="rule-members" aria-label="파티 인원">
          <option value="4">4인</option>
          <option value="8">8인</option>
          <option value="16">16인</option>
        </select>
        <button class="rule-remove" type="button" title="규칙 삭제" aria-label="규칙 삭제">
          <span class="icon trash"></span>
        </button>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
